<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1">
    <title>Agentforce Chat</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 50px;
        }
        html, body {
            margin: 0;
            height: 100%;
            overflow: hidden;               /* prevents scrolling */
        }
        .flender-bg {
            position: fixed;
            inset: 0;                        /* top:0 right:0 bottom:0 left:0 */
            background: url('flender-service-bg.png') center center / cover no-repeat;
            background-color: #01030a;       /* fallback while image loads */
        }
    </style>
</head>
<body>

<div class="flender-bg"></div>

<script type='text/javascript'>
    window.SITE_CONTEXT = {
        isLoggedIn: true,    
        language: "en",     
        userId: "0039Z00002BAa0uQAD",          
        roles: "user,admin,customer", 
        clientIp: "192.168.255.255"            
    };
</script>

<script type='text/javascript'>
    // load hidden pre-chat fields with user context using SF dispatched event "onEmbeddedMessagingReady"
    window.addEventListener('onEmbeddedMessagingReady', () => {
        try {
            const ctx = window.SITE_CONTEXT || {};
            const isLoggedIn = !!ctx.isLoggedIn;

            const contextGeneral = {
                "WebPageURL": String(window.location.href),
                "WebIsLoggedIn": String(isLoggedIn),
                "WebClientIP": String(ctx.clientIp || ""),
                "WebLanguage": String(document.documentElement.lang || "")
            };

            const contextLoggedIn = !isLoggedIn ? {} : {
                "WebUserId": String(ctx.userId || ""),
                "WebRoles": String(ctx.roles || "")//,
                //"WebLanguage": String(ctx.language || "")
            };

            embeddedservice_bootstrap.prechatAPI.setHiddenPrechatFields({
                ...contextGeneral,
                ...contextLoggedIn
            });
        } catch (err) {
			console.error('Error loading context information: ', err);
		}
    })

    // loading embedded messaging
    function initEmbeddedMessaging() {
        try {
			embeddedservice_bootstrap.settings.language = 'en_US'; // For example, enter 'en', 'en-US' or 'en_US'

			embeddedservice_bootstrap.init(
				'00D9Z00000PX42h',
				'Mall_Demo_Agentforce_Messaging',
				'https://flender--ibmdev.sandbox.my.site.com/ESWMallDemoAgentforceM1785964764088',
				{
					scrt2URL: 'https://flender--ibmdev.sandbox.my.salesforce-scrt.com'
				}
			);
		} catch (err) {
			console.error('Error loading Embedded Messaging: ', err);
		}
	};
</script>
<script type='text/javascript' src='https://flender--ibmdev.sandbox.my.site.com/ESWMallDemoAgentforceM1785964764088/assets/js/bootstrap.min.js' onload='initEmbeddedMessaging()'></script>


</body>
</html>
